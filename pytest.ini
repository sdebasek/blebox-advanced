[pytest]
asyncio_mode = auto
testpaths = tests

# Coverage is on by default so a local run reports the same number CI measures.
# Branch coverage is included because an audit found it materially lower than
# line coverage, which line coverage alone hides. The failure threshold lives in
# the workflow, not here, so running a single test file locally still passes.
addopts =
    --cov=custom_components/blebox_advanced
    --cov-branch
    --cov-report=term-missing
