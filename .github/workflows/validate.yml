name: Validate

on:
  # Branches other than main are covered by their pull request. Listening to a
  # bare push as well ran every job twice for any branch with a PR open.
  push:
    branches: [main]
  pull_request:
  # Weekly, so a Home Assistant release that breaks the integration is caught
  # without waiting for someone to push. Only the `latest HA` job below can
  # actually see that: every other job installs a pinned core and would pass on
  # Monday for the same reason it passed on the last push.
  schedule:
    - cron: "0 4 * * 1"
  # So the weekly jobs can be run on demand rather than only on Monday, which
  # matters when a Home Assistant beta is already suspected of breaking things.
  workflow_dispatch:

# Nothing here writes to the repository, so take less than the repository
# default may otherwise grant.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the run already in
# flight irrelevant, so cancel it rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Lint needs ruff and nothing else, so install that one pinned line rather
      # than the whole Home Assistant test stack. Reading the version out of
      # requirements-test.txt keeps a single pin for CI and contributors.
      - run: pip install "$(grep '^ruff==' requirements-test.txt)"
      - run: ruff check custom_components tests
      # --check reports rather than rewrites, which is the only useful shape in
      # CI: the fix is for the contributor to run `ruff format` locally.
      - run: ruff format --check custom_components tests

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          # Home Assistant is a large install and the pins rarely move, so the
          # wheels are worth keeping. The path is explicit because the action
          # looks for requirements.txt by default and this repository has none.
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      # The --cov options live in pytest.ini so a local run measures the same
      # thing; only the threshold is a CI decision.
      #
      # The suite sits at 98% counting branches. The floor is set below that on
      # purpose: it exists to catch a change that guts coverage, not to make
      # every honest refactor a CI failure. Raise it when the real figure has
      # settled well above it, never lower it to make a red build pass.
      - run: pytest -q --cov-fail-under=95

  # HACS refuses to install the integration on a core older than hacs.json's
  # `homeassistant` key, so that key is a promise that the code imports there.
  # It was wrong once already: the declared floor sat at 2025.2.0 while every
  # platform imported a name that only exists from 2025.3.0, which HACS turns
  # into a traceback on the user's box instead of the "needs a newer Home
  # Assistant" message it exists to produce. Nothing else in this workflow can
  # notice, because everything else installs one pinned modern core.
  minimum-ha:
    name: minimum HA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Home Assistant supports a narrow band of Python versions, so this
          # tracks the declared floor rather than the version the other jobs
          # use. Move it when the floor moves past what 3.13 can install.
          python-version: "3.13"
      # Reading the floor back out of hacs.json rather than repeating it here is
      # the point: a second pin could drift from the claim it is meant to guard.
      - run: pip install "homeassistant==$(python -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')"
      # Importing every module is enough to catch this class of break, because
      # the imports that fail are unconditional and at module scope. Running the
      # suite here is not, and would fail on unrelated API drift across the year
      # or more between the floor and the version the tests are written against.
      - run: |
          python - <<'PY'
          import importlib
          import pathlib
          import sys

          sys.path.insert(0, ".")
          package = "custom_components.blebox_advanced"
          for path in sorted(pathlib.Path(package.replace(".", "/")).glob("*.py")):
              name = package if path.stem == "__init__" else f"{package}.{path.stem}"
              importlib.import_module(name)
              print("imported", name)
          PY

  # The job the weekly schedule exists for. `tests` above pins
  # pytest-homeassistant-custom-component, which pins one exact Home Assistant,
  # so it can never see a core release that removed or renamed an API this
  # integration uses. This one installs whatever shipped since.
  latest-ha:
    name: latest HA
    # Scheduled and manual only, on purpose. An upstream release breaking the
    # integration is not the contributor's fault, and this must never be able to
    # redden their pull request. Keeping it off `pull_request` entirely is
    # stronger than continue-on-error, which would also hide a real break behind
    # a green run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches `tests`. If Home Assistant outgrows it, pip fails to resolve
          # here first, which is itself the signal to bump both.
          python-version: "3.14"
      # Deliberately not -r requirements-test.txt: that file is what makes this
      # run pointless. pytest-cov is named because pytest.ini always measures
      # coverage, so the run needs it even though it also arrives transitively.
      - run: pip install pytest-homeassistant-custom-component pytest-cov
      # No --cov-fail-under: this run is about whether the integration still
      # works against current Home Assistant, not about coverage.
      - run: pytest -q

  # A scheduled run that fails notifies nobody. There is no pull request to
  # redden and no pushing author to mail, so `latest HA` sat red for two days in
  # August before anyone looked, which is the whole value of the job gone. An
  # issue does notify, and it is also the right place to track the break.
  #
  # Deliberately not on `workflow_dispatch`: a manual run is already being
  # watched by whoever started it, and filing an issue at them is noise.
  report-failure:
    name: report failure
    needs: [hassfest, hacs, ruff, tests, minimum-ha, latest-ha]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # The only job here that writes anything. The workflow grants `contents:
    # read` above, and job-level permissions replace that rather than adding to
    # it, so `contents` is restated.
    permissions:
      contents: read
      issues: write
    steps:
      # One open issue at a time, commented on rather than reopened weekly. An
      # upstream break stays broken until someone fixes it, so filing a fresh
      # issue every Monday would bury the original under its own duplicates.
      - run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --label ci-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing as of $(date -u +%Y-%m-%d). [Run]($run_url)"
          else
            gh issue create \
              --title "Weekly run against current Home Assistant is failing" \
              --label ci-failure \
              --body "$(cat <<BODY
          The scheduled \`Validate\` run failed. This is usually \`latest HA\`, which
          installs whatever Home Assistant has shipped since the pinned version in
          \`requirements-test.txt\`, so a failure here normally means core changed
          something the integration or its tests rely on.

          Released versions are unaffected until the pin moves, but the pin cannot
          move until this is fixed.

          [Failing run]($run_url)

          Closing this issue is what re-arms the notification: while it is open,
          later failures are added as comments instead.
          BODY
          )"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
