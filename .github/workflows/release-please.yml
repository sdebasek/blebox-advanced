name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      # Opens (and keeps updating) a release PR that bumps the version in both
      # version.txt and the integration manifest, and rewrites CHANGELOG.md from
      # the conventional commits since the last tag. Merging that PR is what
      # creates the tag and the GitHub release.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
