name: Release Please

on:
  push:
    branches: [main]

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # release-please pushes the release branch and creates the tag and release
    # (contents), and opens or updates its release PR (pull-requests). Scoped to
    # this job so anything added to this workflow later starts with nothing.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Opens (and keeps updating) a release PR that bumps the version in both
      # version.txt and the integration manifest, and rewrites CHANGELOG.md from
      # the conventional commits since the last tag. Merging that PR is what
      # creates the tag and the GitHub release.
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
